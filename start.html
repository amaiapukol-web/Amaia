<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <title>Mamoid</title>
  <meta property="og:title" content="Mamoid — Educational AI Imaging Demo">
  <meta property="og:description" content="Mamoid educational AI imaging demo">
  <meta property="og:image" content="https://amaiapukol-web.github.io/Amaia/mamoid-thumbnail.jpg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://amaiapukol-web.github.io/Amaia/mamoid-thumbnail.jpg">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#020617;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    body{min-height:100vh;overflow:hidden}
    .cover{
      position:relative;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:#020617;
      overflow:hidden;
    }
    .cover img{
      width:100vw;
      height:100vh;
      object-fit:cover;
      object-position:center;
      display:block;
    }
    .enter{
      position:absolute;
      left:50%;
      bottom:max(30px,6vh);
      transform:translateX(-50%);
      text-decoration:none;
      color:white;
      font-weight:900;
      font-size:16px;
      padding:14px 24px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.35);
      background:rgba(6,10,28,.78);
      backdrop-filter:blur(12px);
      box-shadow:0 12px 40px rgba(0,0,0,.5),0 0 25px rgba(139,92,246,.3);
      white-space:nowrap;
    }
    @media (max-width:700px){
      .cover img{object-fit:cover}
      .enter{bottom:28px;font-size:15px;padding:13px 22px}
    }
  </style>
</head>
<body>
  <main class="cover">
    <img src="./mamoid-thumbnail.jpg?v=3" alt="Mamoid — Educational AI Imaging Demo">
    <a class="enter" href="./?app=1">Enter Mamoid →</a>
  </main>
</body>
</html>
