<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <title>Mamoid</title>
  <meta property="og:title" content="Mamoid — Educational AI Imaging Demo">
  <meta property="og:description" content="Mamoid educational AI imaging demo">
  <meta property="og:image" content="https://amaiapukol-web.github.io/Amaia/mamoid-thumbnail.jpg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://amaiapukol-web.github.io/Amaia/mamoid-thumbnail.jpg">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#01030a;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    body{min-height:100vh;overflow:hidden}
    .cover{position:relative;min-height:100vh;display:grid;place-items:center;background:#01030a;overflow:hidden}
    .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block;filter:saturate(1.12) contrast(1.05) brightness(.82);transform:scale(1.03)}
    .shade{position:absolute;inset:0;background:radial-gradient(circle at 50% 62%,rgba(26,50,120,.08),transparent 30%),linear-gradient(180deg,rgba(0,0,0,.08),rgba(1,4,14,.34) 62%,rgba(0,0,0,.56))}
    .content{position:relative;z-index:3;width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 20px max(38px,6vh);text-align:center;pointer-events:none}
    .title{margin:0 0 18px;font-size:clamp(4rem,16vw,8rem);line-height:.9;font-weight:950;letter-spacing:-.06em;background:linear-gradient(90deg,#76d7ff 0%,#f8fbff 48%,#95a8ff 75%,#7c3aed 100%);-webkit-background-clip:text;color:transparent;text-shadow:0 0 28px rgba(63,172,255,.16);filter:drop-shadow(0 0 14px rgba(70,130,255,.28))}
    .buttonWrap{position:relative;display:grid;place-items:center;min-width:340px;min-height:130px;pointer-events:auto}
    .enter{position:relative;z-index:3;text-decoration:none;color:white;font-weight:950;font-size:clamp(1.1rem,4vw,1.45rem);padding:18px 34px;min-width:250px;border-radius:999px;border:1px solid rgba(255,255,255,.42);background:linear-gradient(135deg,rgba(7,14,38,.95),rgba(19,35,88,.92) 58%,rgba(27,50,130,.94));backdrop-filter:blur(14px);box-shadow:0 18px 45px rgba(0,0,0,.54),0 0 18px rgba(73,149,255,.62),0 0 42px rgba(43,91,255,.38),inset 0 0 24px rgba(111,185,255,.08);white-space:nowrap;animation:buttonPulse 2.7s ease-in-out infinite}
    .enter::after{content:"";position:absolute;inset:-7px;border-radius:999px;border:1px solid rgba(82,160,255,.32);box-shadow:0 0 24px rgba(82,160,255,.36);animation:ringPulse 2.2s ease-in-out infinite;pointer-events:none}
    .stars{position:absolute;inset:0;pointer-events:none;z-index:2}
    .star{position:absolute;display:block;line-height:1;text-shadow:0 0 10px currentColor,0 0 20px currentColor;animation:twinkle 1.8s ease-in-out infinite;opacity:.8}
    .blue{color:#123a8e}.electric{color:#42b6ff}.white{color:#ffffff}.black{color:#05070f;text-shadow:0 0 8px rgba(255,255,255,.12)}
    .s1{left:8%;top:18%;font-size:18px;animation-delay:.1s}.s2{left:18%;top:35%;font-size:11px;animation-delay:.8s}.s3{left:31%;top:14%;font-size:24px;animation-delay:1.2s}.s4{left:74%;top:18%;font-size:16px;animation-delay:.5s}.s5{left:87%;top:34%;font-size:24px;animation-delay:1.5s}.s6{left:64%;top:44%;font-size:12px;animation-delay:.3s}.s7{left:24%;top:64%;font-size:18px;animation-delay:1s}.s8{left:76%;top:63%;font-size:14px;animation-delay:1.7s}.s9{left:39%;top:72%;font-size:11px;animation-delay:.6s}.s10{left:58%;top:76%;font-size:22px;animation-delay:1.3s}.s11{left:46%;top:83%;font-size:13px;animation-delay:.2s}.s12{left:84%;top:79%;font-size:10px;animation-delay:1.1s}.s13{left:14%;top:79%;font-size:10px;animation-delay:1.9s}.s14{left:50%;top:60%;font-size:16px;animation-delay:.9s}
    .sparkA{position:absolute;left:8%;top:22%;font-size:26px;color:#67c7ff;animation:twinkle 1.35s ease-in-out infinite}.sparkB{position:absolute;right:7%;top:18%;font-size:20px;color:#ffffff;animation:twinkle 1.8s ease-in-out .4s infinite}.sparkC{position:absolute;left:17%;bottom:14%;font-size:18px;color:#173b8f;animation:twinkle 1.5s ease-in-out .7s infinite}.sparkD{position:absolute;right:16%;bottom:12%;font-size:25px;color:#49b7ff;animation:twinkle 1.25s ease-in-out .2s infinite}
    @keyframes twinkle{0%,100%{opacity:.18;transform:scale(.72) rotate(0deg)}50%{opacity:1;transform:scale(1.24) rotate(12deg)}}
    @keyframes buttonPulse{0%,100%{transform:scale(1);box-shadow:0 18px 45px rgba(0,0,0,.54),0 0 18px rgba(73,149,255,.52),0 0 42px rgba(43,91,255,.28)}50%{transform:scale(1.035);box-shadow:0 20px 50px rgba(0,0,0,.56),0 0 25px rgba(84,185,255,.78),0 0 58px rgba(38,95,255,.48)}}
    @keyframes ringPulse{0%,100%{opacity:.35;transform:scale(.98)}50%{opacity:.9;transform:scale(1.07)}}
    @media (max-width:700px){.content{padding-bottom:max(28px,5vh)}.title{font-size:clamp(4.3rem,23vw,7rem);margin-bottom:12px}.buttonWrap{min-width:300px;min-height:120px}.enter{min-width:235px;padding:17px 28px;font-size:1.12rem}.s7{left:10%;top:66%}.s8{left:86%;top:63%}.s10{left:68%;top:78%}.s13{left:5%;top:82%}}
  </style>
</head>
<body>
  <main class="cover">
    <img src="./mamoid-thumbnail.jpg?v=5" alt="Mamoid — Educational AI Imaging Demo">
    <div class="shade"></div>
    <div class="stars" aria-hidden="true">
      <span class="star white s1">✦</span><span class="star electric s2">✧</span>
      <span class="star blue s3">✦</span><span class="star white s4">✦</span>
      <span class="star electric s5">✧</span><span class="star black s6">✦</span>
      <span class="star blue s7">✦</span><span class="star white s8">✧</span>
      <span class="star black s9">✦</span><span class="star electric s10">✦</span>
      <span class="star white s11">✧</span><span class="star blue s12">✦</span>
      <span class="star black s13">✧</span><span class="star electric s14">✦</span>
    </div>
    <div class="content">
      <h1 class="title">Mamoid</h1>
      <div class="buttonWrap">
        <span class="sparkA">✦</span><span class="sparkB">✧</span><span class="sparkC">✦</span><span class="sparkD">✧</span>
        <a class="enter" href="./index.html?app=1">Enter Mamoid →</a>
      </div>
    </div>
  </main>
</body>
</html>
